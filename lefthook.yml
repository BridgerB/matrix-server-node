# Git hooks managed by lefthook (https://lefthook.dev).
# Installed automatically by `npm install` (the `prepare` script), or run
# `npx lefthook install` manually.
#
# pre-commit runs sequentially (parallel: false), in priority order:
#   1. format — biome formats the staged TypeScript and re-stages it.
#   2. lint   — `npm run lint` (biome check) must pass.
#   3. check  — `npm run check` (tsc --noEmit) must pass.
# A non-zero exit from any step blocks the commit.
pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      # `*` spans path separators in lefthook's matcher, so this matches every
      # .ts under src (both src/foo.ts and src/a/b.ts) — unlike `src/**/*.ts`,
      # whose literal `/` after `**` skips top-level files.
      glob: "src/*.ts"
      run: npm run format
      stage_fixed: true
    lint:
      priority: 2
      glob: "src/*.ts"
      run: npm run lint
    check:
      priority: 3
      glob: "src/*.ts"
      run: npm run check
